<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04060d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="NOVA TANKS — a fast-paced evolution arena shooter. Farm, evolve, dominate." />
    <title>NOVA TANKS · Evolution Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime"
      }
    }
    </script>
    <style type="text/tailwindcss">
@import "tailwindcss";

@theme {
  --font-display: "Orbitron", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Rajdhani", ui-sans-serif, system-ui, sans-serif;
  --color-void: #04060d;
  --color-panel: #0a1122;
  --color-neon: #4de3ff;
  --color-neon2: #b06bff;
  --color-danger: #ff4d6d;
  --color-gold: #ffc94d;
}

html,
body,
#root {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #04060d;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: none;
  font-family: var(--font-body);
  user-select: none;
  -webkit-user-select: none;
}

canvas {
  display: block;
  touch-action: none;
}

/* ---------- panels & buttons ---------- */
.panel {
  background: linear-gradient(160deg, rgba(13, 20, 40, 0.92), rgba(6, 10, 22, 0.94));
  border: 1px solid rgba(90, 160, 255, 0.22);
  border-radius: 16px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 12px 40px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.btn-primary {
  font-family: var(--font-display);
  letter-spacing: 0.14em;
  color: #031018;
  background: linear-gradient(180deg, #7df3ff, #2bc9f5 55%, #0e9ed8);
  border-radius: 14px;
  box-shadow: 0 0 24px rgba(45, 205, 255, 0.55), 0 6px 18px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.7);
  animation: pulseGlow 2.2s ease-in-out infinite;
}
.btn-primary:active {
  transform: scale(0.96);
}

.btn-ghost {
  font-family: var(--font-display);
  letter-spacing: 0.1em;
  color: #bfe9ff;
  background: rgba(20, 40, 80, 0.5);
  border: 1px solid rgba(110, 190, 255, 0.35);
  border-radius: 12px;
}
.btn-ghost:active {
  transform: scale(0.96);
  background: rgba(30, 60, 110, 0.6);
}

.stat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border-radius: 12px;
  border: 1px solid rgba(120, 200, 255, 0.25);
  background: linear-gradient(180deg, rgba(24, 42, 82, 0.9), rgba(10, 18, 40, 0.9));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  transition: transform 0.08s ease;
}
.stat-btn:active {
  transform: scale(0.92);
  border-color: rgba(120, 230, 255, 0.8);
  box-shadow: 0 0 16px rgba(60, 200, 255, 0.5);
}

/* ---------- animations ---------- */
@keyframes pulseGlow {
  0%,
  100% {
    box-shadow: 0 0 18px rgba(45, 205, 255, 0.4), 0 6px 18px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  50% {
    box-shadow: 0 0 38px rgba(45, 205, 255, 0.85), 0 6px 18px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
}

@keyframes floaty {
  0%,
  100% {
    transform: translateY(0) rotate(0deg);
  }
  50% {
    transform: translateY(-14px) rotate(8deg);
  }
}
@keyframes riseFade {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes feedIn {
  from {
    opacity: 0;
    transform: translateX(-12px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
@keyframes popIn {
  0% {
    opacity: 0;
    transform: scale(0.85);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes blinkSoft {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.45;
  }
}
@keyframes scanline {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: 0 60px;
  }
}

.anim-rise {
  animation: riseFade 0.35s ease both;
}
.anim-feed {
  animation: feedIn 0.3s ease both;
}
.anim-pop {
  animation: popIn 0.28s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
.anim-blink {
  animation: blinkSoft 1.1s ease-in-out infinite;
}

.menu-grid-bg {
  background-image: linear-gradient(rgba(70, 130, 220, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70, 130, 220, 0.09) 1px, transparent 1px);
  background-size: 44px 44px;
}

.hud-bar {
  border-radius: 999px;
  background: rgba(3, 6, 14, 0.72);
  border: 1px solid rgba(140, 200, 255, 0.25);
  overflow: hidden;
}

.stick-base {
  position: absolute;
  border-radius: 999px;
  border: 2px solid rgba(140, 220, 255, 0.4);
  background: radial-gradient(circle, rgba(60, 140, 220, 0.12), rgba(10, 20, 45, 0.25));
  box-shadow: 0 0 24px rgba(40, 160, 255, 0.18), inset 0 0 20px rgba(40, 140, 255, 0.12);
  pointer-events: none;
}
.stick-knob {
  position: absolute;
  border-radius: 999px;
  background: radial-gradient(circle at 35% 30%, #b8f2ff, #35b6ea 55%, #1573b8);
  box-shadow: 0 0 18px rgba(70, 200, 255, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.5);
  pointer-events: none;
}

.scanlines::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(120, 200, 255, 0.035) 0px,
    rgba(120, 200, 255, 0.035) 1px,
    transparent 2px,
    transparent 4px
  );
  animation: scanline 6s linear infinite;
}

.safe-b {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.safe-t {
  padding-top: env(safe-area-inset-top, 0px);
}

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
